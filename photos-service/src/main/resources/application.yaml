server:
  port: 8081

spring:
  application:
    name: photos-service

  datasource:
    url: jdbc:postgresql://localhost:5432/photos
    username: photos_user
    password: 123456!
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

storage:
  location: ./uploads-photos

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
