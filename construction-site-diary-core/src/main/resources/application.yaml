app:
  base-url: http://localhost:8080

spring:
  application:
    name: construction-site-diary

  datasource:
    url: jdbc:postgresql://localhost:5432/construction_site_diary
    username: construction_site_diary
    password: construction_site_diary
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: construction_site_diary
    password: diary

keycloak:
  admin:
    server-url: http://localhost:8180
    realm: construction-site-diary
    client-id: construction-site-diary-admin
    client-secret: Pe96CCHMT6vC3892u8okLB6nE9deP2iH
    target-realm: construction-site-diary
    default-role: USER
  client:
    server-url: http://localhost:8180
    realm: construction-site-diary
    client-id: construction-site-diary-client
    client-secret: 4gNpOPtcyflyPKwONo9sT4LEWR56aRK7

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
