services:
  postgres:
    image: postgres:18
    container_name: construction-site-diary-postgres
    environment:
      POSTGRES_DB: construction_site_diary
      POSTGRES_USER: construction_site_diary
      POSTGRES_PASSWORD: construction_site_diary
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  redis:
    image: redis:8-alpine
    container_name: construction-site-diary-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: construction-site-diary-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/construction_site_diary
      KC_DB_USERNAME: construction_site_diary
      KC_DB_PASSWORD: construction_site_diary
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    command: start-dev
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  keycloak_data: